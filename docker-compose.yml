services:
  app:
    build: .
    container_name: sms-app
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
      - "5173:5173"
    command: bash -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8
    container_name: sms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sms_management
    ports:
      - "3310:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sms-pma
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8084:80"
    depends_on:
      - mysql

  redis:
    image: redis:alpine
    container_name: sms-redis
    restart: always
    ports:
      - "6384:6379"
